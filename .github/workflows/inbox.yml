name: Deploy inbox Worker

# Puts tools/inbox-worker/ (the contact page's captcha and inbox) on Cloudflare. Runs when the Worker or the captcha's
# drawings change, or by hand. It needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   INBOX_ADMIN_KEY        a long passphrase you make up; /stats/ asks for it to open the Inbox
#   SLACK_WEBHOOK          optional: a Slack incoming-webhook address, pinged for each note
#   CLOUDFLARE_ACCOUNT_ID  optional: only if the token can see more than one account
# Until the first two exist, a run does nothing and says so.

on:
  push:
    branches: [main]
    paths:
      - "tools/inbox-worker/**"
      - "contact/squares.js"
      - ".github/workflows/inbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbox-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INBOX_ADMIN_KEY: ${{ secrets.INBOX_ADMIN_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Are the secrets here?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$INBOX_ADMIN_KEY" ]; then
            echo "::notice::Not deployed: add the CLOUDFLARE_API_TOKEN and INBOX_ADMIN_KEY secrets, then run this again."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 22
      - name: Find the account and the notes' storage (made the first time)
        if: steps.ready.outputs.go == 'true'
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(api "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[0].id // empty')
          fi
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::The token cannot see a Cloudflare account. Add the CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          kv=$(api "$base/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title == "megazine-inbox") | .id' | head -n 1)
          if [ -z "$kv" ]; then
            kv=$(api -X POST "$base/storage/kv/namespaces" --data '{"title":"megazine-inbox"}' | jq -r '.result.id')
            echo "Made the storage."
          fi
          [ -n "$kv" ] && [ "$kv" != "null" ] || { echo "::error::Could not find or make the KV namespace."; exit 1; }
          sed -i "s/^id = .*/id = \"$kv\"/" tools/inbox-worker/wrangler.toml
          sub=$(api "$base/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          echo "SUBDOMAIN=$sub" >> "$GITHUB_ENV"
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        working-directory: tools/inbox-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy
          printf '%s' "$INBOX_ADMIN_KEY" | npx --yes wrangler@4 secret put ADMIN_KEY
          if [ -n "${SLACK_WEBHOOK:-}" ]; then printf '%s' "$SLACK_WEBHOOK" | npx --yes wrangler@4 secret put SLACK_WEBHOOK; fi
          if [ -n "${SUBDOMAIN:-}" ]; then
            echo "Inbox Worker: https://megazine-inbox.$SUBDOMAIN.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
